# Nixpacks build configuration (Railway).
#
# 1. yt-dlp WITHOUT Python
#    `youtube-dl-exec` defaults to the release asset named `yt-dlp`, which on
#    Linux is a Python *zipapp*: ~3 MB, and its shebang resolves `python3` from
#    PATH at RUNTIME. Adding python3 to the Nix setup phase was not enough —
#    it lands in the build layer, and the deployed container still failed with
#    "yt-dlp will not run" (caught by the startup check, 2026-08-31).
#
#    So fetch `yt-dlp_linux` instead: the PyInstaller standalone build (~40 MB)
#    that embeds its own interpreter and needs no system Python at all. The
#    preinstall Python check is then genuinely vestigial and is skipped.
#
#    Both variables must also be present at RUNTIME, because the package
#    resolves the binary's path from them. CORRECTION (2026-09-01): nixpacks
#    `[variables]` do NOT reach the runtime environment — the deployed bot
#    still looked for `bin/yt-dlp` and failed. They must be set as RAILWAY
#    SERVICE VARIABLES, which apply to both build and runtime. The block below
#    is kept so a local `nixpacks build` behaves the same, but the service
#    variables are what actually make it work.
#
# 2. NO BUILD STEP
#    Nixpacks otherwise picks up `npm run deploy` as the build command.
#    Registering slash commands during a build needs DISCORD_TOKEN at build
#    time, re-registers on every deploy, and makes a Discord outage fail the
#    build. Registration is a deliberate manual step (`npm run deploy`).

[variables]
YOUTUBE_DL_SKIP_PYTHON_CHECK = "1"
YOUTUBE_DL_FILENAME = "yt-dlp_linux"

[phases.build]
# Nothing to build — plain ESM JavaScript, run directly by Node.
cmds = []
